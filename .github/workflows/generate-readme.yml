name: Generate README and skill

on:
  push:
    branches: [main]
    paths: ['data.json', 'scripts/generate-readme.js', 'scripts/generate-skill.js', 'scripts/provider-setup.js', 'free-llm-apis/SKILL.md']

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate README and skill
        run: |
          node scripts/generate-readme.js
          node scripts/generate-skill.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md free-llm-apis
          git diff --staged --quiet || git commit -m "docs: regenerate README and skill from data.json"
          git push
